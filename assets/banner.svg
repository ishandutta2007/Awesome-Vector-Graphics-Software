<svg width="100%" height="auto" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180d2c" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Path Gradients -->
    <linearGradient id="curveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="curveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <!-- Vector Pattern Grid -->
    <pattern id="vectorGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1.5" fill="#64748b" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="440" fill="url(#bgGrad)" />
  <rect width="1200" height="440" fill="url(#vectorGrid)" />

  <!-- Dynamic Animated Orbs in Background -->
  <circle cx="150" cy="120" r="160" fill="url(#orbCyan)">
    <animate attributeName="r" values="140;175;140" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cx" values="150;180;150" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="130" r="210" fill="url(#orbIndigo)">
    <animate attributeName="r" values="190;230;190" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="130;160;130" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="380" r="230" fill="url(#orbRose)">
    <animate attributeName="r" values="210;250;210" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Background Dynamic Vector Paths & Animated Béziers -->
  <!-- Spline 1 with moving dashoffset -->
  <path d="M -50,310 C 220,160 420,440 760,280 C 960,190 1100,280 1250,210" 
        fill="none" stroke="url(#curveGrad1)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 8" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-352" dur="16s" repeatCount="indefinite" />
  </path>

  <!-- Spline 2 Glowing Contour with animated pulse -->
  <path d="M -20,130 C 280,240 460,40 780,170 C 1000,260 1120,90 1230,150" 
        fill="none" stroke="url(#curveGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.45" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="280" dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Dynamic Vector Nodes / Anchor Handles Simulation (Background/Decorative) -->
  <g opacity="0.6">
    <!-- Anchor 1 -->
    <line x1="220" y1="210" x2="280" y2="150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3">
      <animate attributeName="x2" values="280;295;280" dur="4s" repeatCount="indefinite" />
    </line>
    <circle cx="280" cy="150" r="4.5" fill="#38bdf8">
      <animate attributeName="cx" values="280;295;280" dur="4s" repeatCount="indefinite" />
    </circle>
    <rect x="215" y="205" width="10" height="10" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" transform="rotate(45 220 210)" />

    <!-- Anchor 2 -->
    <line x1="980" y1="230" x2="920" y2="290" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3">
      <animate attributeName="y2" values="290;270;290" dur="5s" repeatCount="indefinite" />
    </line>
    <circle cx="920" cy="290" r="4.5" fill="#c084fc">
      <animate attributeName="cy" values="290;270;290" dur="5s" repeatCount="indefinite" />
    </circle>
    <rect x="975" y="225" width="10" height="10" fill="#9333ea" stroke="#ffffff" stroke-width="1.5" transform="rotate(45 980 230)" />
  </g>

  <!-- Decorative Corner Geometric Marks -->
  <g stroke="#475569" stroke-width="1" opacity="0.6">
    <!-- Top Left Coordinates -->
    <path d="M 30,45 L 30,30 L 45,30" fill="none" />
    <path d="M 1170,45 L 1170,30 L 1155,30" fill="none" />
    <path d="M 30,395 L 30,410 L 45,410" fill="none" />
    <path d="M 1170,395 L 1170,410 L 1155,410" fill="none" />
  </g>

  <!-- ============================================================== -->
  <!-- FOREGROUND LAYER: TITLE, SUBTITLE & BADGES (NEVER HIDDEN)      -->
  <!-- ============================================================== -->
  <g id="foreground-content">
    
    <!-- Header Kicker Tag / Pill -->
    <g transform="translate(600, 72)">
      <rect x="-185" y="-17" width="370" height="34" rx="17" 
            fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">
        ⚡ CURATED ECOSYSTEM &amp; BENCHMARKS
      </text>
    </g>

    <!-- Main Title (Crisp, High Contrast, Centered Foreground) -->
    <text x="600" y="165" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="50" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Awesome Vector Graphics Software
    </text>

    <!-- Subtitle (Clear, Readable) -->
    <text x="600" y="215" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="19" font-weight="400" fill="#94a3b8">
      Industry SaaS Suites, Procedural Node Engines, &amp; Self-Hosted Open-Source Editors
    </text>

    <!-- Feature Pillars (3 Glassmorphic foreground cards) -->
    <g transform="translate(140, 275)" filter="url(#cardShadow)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">🏢</text>
        <text x="56" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
          Top SaaS Suites
        </text>
        <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
          Ranked by Company Scale &amp; Tiers
        </text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(320, 0)">
        <rect width="280" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">⭐</text>
        <text x="56" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
          Open-Source Hub
        </text>
        <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
          16+ Repos Sorted by Live Stars
        </text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(640, 0)">
        <rect width="280" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">🎯</text>
        <text x="56" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
          SVG-Native Workflows
        </text>
        <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
          Procedural Nodes, Web &amp; Desktop
        </text>
      </g>
    </g>

    <!-- Bottom Mini-Legend / Version Indicator -->
    <text x="600" y="415" text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="12" font-weight="500" fill="#64748b" letter-spacing="1">
      COLLABORATIVE DESIGN • PROCEDURAL GENERATION • DESKTOP &amp; CLOUD APPS
    </text>

  </g>
</svg>
